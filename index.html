<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietcone Leads</title>
<meta name="description" content="Vietcone Travel — ghi nhận và chuyển giao khách tại hội chợ, workshop">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vietcone Leads">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --rust:#B0412F; --rust-d:#8F3322; --rust-t:#F6E8E4;
  --red:#E31E24; --gold:#E3BE00; --gold-d:#8C7000; --gold-t:#FBF4D6;
  --grey-d:#5F5954; --grey-t:#EFECE8;
  --cream:#FFFCF6; --paper:#FFFFFF; --ink:#2F2E2E; --muted:#6E6762;
  --line:#ECE4D8; --line2:#D8CDBE; --ok:#2E7D4F; --ok-t:#E6F3EB;
  --nav:62px; --r:14px;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p,li,dd,small{text-wrap:pretty}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px}
.logo{height:32px;width:auto;display:block}
.evchip{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--cream);border:1px solid var(--line);font-size:13px;color:var(--muted);text-align:left}
.evchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evchip b{color:var(--ink);font-weight:600}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;flex:none}
.lang button{font-size:12px;font-weight:600;letter-spacing:.04em;padding:6px 8px;color:var(--muted)}
.lang button.on{background:var(--rust);color:#fff}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--ink);flex:none}
.icon-btn:active{background:var(--grey-t)}

/* layout */
main{max-width:600px;margin:0 auto;padding:12px 12px calc(var(--nav) + 24px + env(safe-area-inset-bottom))}
.ttl{font-family:var(--serif);font-weight:600;font-size:26px;color:var(--rust);line-height:1.15;margin:4px 2px 2px}
.sub{color:var(--muted);font-size:13px;margin:0 2px 10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 10px}
.card h2{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h2 .n{width:24px;height:24px;border-radius:50%;background:var(--rust);color:#fff;font:600 13px/24px var(--sans);text-align:center;flex:none}
.req{color:var(--rust);font-style:normal;font-weight:700}
.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin:10px 0 5px}
.card h2 + .fld .lbl,.card h2 + .lbl{margin-top:0}
.fld{min-width:0}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=month],input[type=search],textarea{
  width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
input[type=month]{min-height:46px;display:block}
textarea{resize:vertical;min-height:84px;line-height:1.4}
input:focus,textarea:focus{border-color:var(--rust);box-shadow:0 0 0 3px var(--rust-t)}
input.bad{border-color:var(--rust);background:#FFF8F6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint,.rule{font-size:13px;color:var(--muted);margin:8px 2px 0}
.rule{border-left:3px solid var(--gold);padding-left:8px}
.err{font-size:13px;color:var(--rust);font-weight:600;margin:6px 2px 0}
.err:empty{display:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:14px;line-height:1.2;text-align:left}
.chip.on{background:var(--rust);border-color:var(--rust);color:#fff}
.chip small{font-size:12px;opacity:.75}
.chip.ghost{border-style:dashed;color:var(--rust);border-color:var(--rust)}
.chips.sm .chip{min-height:32px;padding:5px 11px;font-size:13px}
.addtag{display:flex;gap:8px;margin-top:8px}
.addtag input{flex:1}

/* priority */
.prio{display:grid;gap:8px}
.pr{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;text-align:left}
.pr b{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:700 17px/1 var(--sans);flex:none}
.pr span{display:flex;flex-direction:column;gap:1px}
.pr strong{font-size:15px}
.pr small{font-size:13px;color:var(--muted);line-height:1.35}
.pr-A b{background:var(--rust-t);color:var(--rust)}
.pr-B b{background:var(--gold-t);color:var(--gold-d)}
.pr-C b{background:var(--grey-t);color:var(--grey-d)}
.pr-A.on{border-color:var(--rust);background:var(--rust-t)}
.pr-B.on{border-color:var(--gold);background:var(--gold-t)}
.pr-C.on{border-color:var(--grey-d);background:var(--grey-t)}
.pr-A.on b{background:var(--rust);color:#fff}
.pr-B.on b{background:var(--gold);color:#3A2F00}
.pr-C.on b{background:var(--grey-d);color:#fff}
.suggest{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--rust);font-weight:600;padding:6px 10px;border-radius:999px;background:var(--rust-t)}
.suggest:empty{display:none}

/* photos */
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.ph .rm svg{width:14px;height:14px}
.ph-add{width:76px;height:76px;border-radius:10px;border:1.5px dashed var(--rust);color:var(--rust);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;text-align:center;line-height:1.15;padding:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid var(--line2);background:#fff;color:var(--ink)}
.btn.primary{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.primary:active{background:var(--rust-d)}
.btn.danger{color:var(--rust);border-color:var(--rust)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.savebar{position:sticky;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;padding:8px 0 0;z-index:5}
.savebar .btn{flex:1;box-shadow:0 6px 18px rgba(47,46,46,.14)}
.savebar .btn:not(.primary){flex:0 0 auto}

/* list */
.search{position:relative}
.search svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.search input{padding-left:40px}
.stats{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 2px}
.lead{display:flex;width:100%;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 8px;text-align:left}
.pb{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 15px/1 var(--sans);flex:none}
.pb-A{background:var(--rust);color:#fff}.pb-B{background:var(--gold);color:#3A2F00}.pb-C{background:var(--grey-d);color:#fff}
.lb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.l1 b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l1 time{font-size:12px;color:var(--muted);flex:none}
.l2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l3{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:2px}
.tg{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--cream);border:1px solid var(--line);color:var(--ink)}
.tg.warn{background:#FFF1EE;border-color:#F0C9C0;color:var(--rust)}
.tg.nx{background:var(--gold-t);border-color:#EEDC95;color:#5A4800}
.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty svg{width:36px;height:36px;color:var(--line2);margin-bottom:6px}

/* handoff */
.facet{margin-top:12px}
.facet:first-of-type{margin-top:4px}
.match{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px;padding:12px;border-radius:12px;background:var(--cream);border:1px solid var(--line)}
.match b{font-size:17px;color:var(--rust)}
.match small{display:block;color:var(--muted);font-size:12px}
.linkbtn{color:var(--rust);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.preview{margin:0 0 12px;padding:0;list-style:none;font-size:13px;border-top:1px dashed var(--line2)}
.preview li{padding:6px 2px;border-bottom:1px dashed var(--line2);display:flex;gap:8px;align-items:center}
.preview .pb{width:22px;height:22px;font-size:12px;border-radius:6px}
.stack{display:grid;gap:8px}
.note-ok{font-size:13px;color:var(--ok);background:var(--ok-t);border-radius:10px;padding:10px 12px;margin-top:10px}
.note-ok:empty{display:none}

/* guide */
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:0 0 12px 38px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--rust);color:#fff;font:600 13px/26px var(--sans);text-align:center}
.steps li>b{display:block;font-size:15px}
.steps li p{margin:2px 0 0;color:var(--muted);font-size:14px}
.rules{margin:0;padding-left:18px}
.rules li{margin:0 0 7px;font-size:14px}
.pin{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--cream)}
.pin h4{font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.pin ol{margin:0;padding-left:20px;font-size:14px}
.pin li{margin:0 0 5px}
.notes{margin:12px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.notes li{margin:0 0 6px}
.ok-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok);background:var(--ok-t);border-radius:10px;padding:9px 12px;margin-bottom:6px}
.ver{text-align:center;font-size:12px;color:var(--muted);margin:16px 0 0}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--line2);border-radius:6px;background:#fff;font-size:13px;line-height:20px}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tabs button.on{color:var(--rust)}
.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--rust)}
.tabs .cnt{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rust);color:#fff;font-size:11px;line-height:18px;text-align:center}

/* sheets */
.layer{position:fixed;inset:0;z-index:40;background:rgba(30,24,20,.42);display:flex;align-items:flex-end;justify-content:center}
.layer[hidden]{display:none}
.sheet{width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--cream);border-radius:18px 18px 0 0;padding:6px 14px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 8px}
.sh-h{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.sh-h h3{flex:1;font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.15}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:7px 12px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0;word-break:break-word}
.acts{display:flex;gap:8px;margin:0 0 12px}
.acts a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:12px;background:#fff;border:1px solid var(--line2);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.meta{font-size:12px;color:var(--muted);margin:12px 0}
.notebox{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.tagrow{display:flex;gap:8px;align-items:center;margin:0 0 8px}
.tagrow input{flex:1;min-height:42px;padding:8px 10px}
.tagrow small{color:var(--muted);font-size:12px;min-width:24px;text-align:right}
.danger-zone{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2)}
.confirm{width:calc(100% - 32px);max-width:420px;align-self:center;background:#fff;border-radius:16px;padding:18px}
.confirm h3{font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:6px}
.confirm p{margin:0 0 14px;color:var(--muted)}
.layer.center{align-items:center}
.viewer{background:rgba(0,0,0,.9);align-items:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{background:#FFF1EE;border:1px solid #F0C9C0;color:var(--rust);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.langbig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.langbig button{min-height:44px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-weight:600}
.langbig button.on{background:var(--rust);border-color:var(--rust);color:#fff}
@media (max-width:360px){.row2{grid-template-columns:1fr}.logo{height:28px}.lang button{padding:6px 6px}}
@media (min-width:700px){body{font-size:15.5px}.sheet{border-radius:18px;margin-bottom:24px}.layer{align-items:center}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div class="layer" id="sheet-wrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="layer center" id="confirm-wrap" hidden><div class="confirm" id="confirm" role="alertdialog" aria-modal="true"></div></div>
<div class="layer viewer" id="viewer" hidden data-act="closeviewer"><img id="viewer-img" alt=""></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photo-input" accept="image/*" multiple hidden>
<input type="file" id="pack-input" accept=".html,.htm,.json,text/html,application/json" hidden>

function fmtTime(iso){if(!iso)return'';const d=new Date(iso);const same=d.toDateString()===new Date().toDateString();try{return new Intl.DateTimeFormat(LOC[S.lang],same?{hour:'2-digit',minute:'2-digit'}:{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d)}catch(e){return d.toLocaleString()}}

function fmtMonth(m){if(!m||!/^\d{4}-\d{2}$/.test(m))return m||'';const[y,mo]=m.split('-');try{return new Intl.DateTimeFormat(LOC[S.lang],{month:'short',year:'numeric'}).format(new Date(+y,+mo-1,1))}catch(e){return m}}
function fmtSize(b){const mb=b/1048576;return mb<1?Math.max(1,Math.round(b/1024))+' KB':mb.toLocaleString(LOC[S.lang],{maximumFractionDigits:1})+' MB'}
function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase().slice(0,40)}

const LS_KEY='vietcone-leads-settings';
function loadSettings(){try{const o=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(o){['lang','name','event','ob'].forEach(k=>{if(o[k]!=null)S[k]=o[k]});if(Array.isArray(o.tags))S.tags=o.tags}else{const l=(navigator.language||'vi').slice(0,2);S.lang=l==='it'?'it':l==='en'?'en':'vi'}}catch(e){}}
function saveSettings(){try{localStorage.setItem(LS_KEY,JSON.stringify({lang:S.lang,name:S.name,event:S.event,ob:S.ob,tags:S.tags}))}catch(e){}}
const DB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('vietcone-leads',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('leads'))d.createObjectStore('leads',{keyPath:'id'})};r.onsuccess=()=>{DB.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
  tx(mode,fn){return new Promise((res,rej)=>{if(!DB.db)return res(null);try{const tx=DB.db.transaction('leads',mode);const st=tx.objectStore('leads');const out=fn(st);tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:null);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})},
  all(){return DB.tx('readonly',st=>st.getAll())},
  put(l){return DB.tx('readwrite',st=>st.put(l))},
  del(id){return DB.tx('readwrite',st=>st.delete(id))},
  clear(){return DB.tx('readwrite',st=>st.clear())}
};

function findTagByLabel(label){const n=normTag(label);return S.tags.find(tg=>{if(normTag(tagLabel(tg))===n)return true;if(tg.key)return ['vi','en','it'].some(l=>normTag(T[l]['tag_'+tg.key])===n);return false})}

function suggestPrio(d){
  const when=!!(d.month||d.pax);
  if((d.dest.length&&when)||(d.needs.includes('quote')&&when))return'A';
  if(!d.type&&!d.needs.length)return'';

function setErr(k,msg){const el=document.querySelector(`[data-err="${k}"]`);if(el)el.textContent=msg||''}
function validate(){
  const d=S.draft;let first=null;const mark=(k,msg,sel)=>{setErr(k,msg);if(msg&&!first)first=sel};
  ['name','reach','type','prio'].forEach(k=>setErr(k,''));document.querySelectorAll('input.bad').forEach(x=>x.classList.remove('bad'));
  if(!d.name.trim()){mark('name',t('err_name'),'#f-name');$('#f-name').classList.add('bad')}
  if(!d.email.trim()&&!d.phone.trim()&&!d.photos.length)mark('reach',t('err_reach'),'#f-email');
  if(!d.type)mark('type',t('err_type'),'[data-err="type"]');

  if(first){const el=$(first);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});if(el.focus&&el.tagName==='INPUT')setTimeout(()=>el.focus({preventScroll:true}),300)}}
  return !first;
}
function findDup(d,selfId){
  const em=d.email.trim().toLowerCase(),ph=digits(d.phone);
  return S.leads.find(l=>{if(l.id===selfId)return false;if(em&&l.email&&l.email.trim().toLowerCase()===em)return true;const lp=digits(l.phone);if(ph&&lp){if(ph===lp)return true;if(ph.length>=9&&lp.length>=9&&ph.slice(-9)===lp.slice(-9))return true}return false});
}
async function saveDraft(){

/* ---------- photos ---------- */
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{try{const M=1280;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,M/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72))}catch(e){URL.revokeObjectURL(url);rej(e)}};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}
async function addPhotos(files){
  const d=S.draft;let skipped=false;
  for(const f of files){if(d.photos.length>=MAX_PHOTOS){skipped=true;break}try{d.photos.push(await compress(f))}catch(e){toast(t('err_photo'))}}
  if(skipped)toast(t('max_photo'));
  const box=$('#photos');if(box)box.innerHTML=photosBox();
  if(d.photos.length)setErr('reach','');
}

  if(h.type.size&&!h.type.has(l.type))return false;
  if(h.by.size&&!h.by.has(l.by))return false;
  if(h.event.size&&!h.event.has(l.event))return false;
  return true}

/* ---------- export: xlsx (no library) ---------- */
const CRC_T=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;tb[n]=c>>>0}return tb})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const n=new Date(),dt=((n.getFullYear()-1980)<<9)|((n.getMonth()+1)<<5)|n.getDate(),tm=(n.getHours()<<11)|(n.getMinutes()<<5)|(n.getSeconds()>>1);
  for(const f of files){
    const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,tm,2],[12,dt,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,name.length,2],[28,0,2]].forEach(([o,v,s])=>s===4?lh.setUint32(o,v,true):lh.setUint16(o,v,true));
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,tm,2],[14,dt,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,name.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([o,v,s])=>s===4?ch.setUint32(o,v,true):ch.setUint16(o,v,true));
    central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  }
  const cs=central.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));
  [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,files.length,2],[10,files.length,2],[12,cs,4],[16,off,4],[20,0,2]].forEach(([o,v,s])=>s===4?end.setUint32(o,v,true):end.setUint16(o,v,true));
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xesc=s=>String(s==null?'':s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};

  const sorted=leads.slice().sort((a,b)=>(a.prio||'').localeCompare(b.prio||'')||(a.createdAt||'').localeCompare(b.createdAt||''));
  const noteCol=14;
  const cell=(r,c,v,s)=>{const ref=colName(c)+r;if(typeof v==='number')return `<c r="${ref}"${s?` s="${s}"`:''}><v>${v}</v></c>`;const str=String(v==null?'':v);if(!str)return'';return `<c r="${ref}" t="inlineStr"${s?` s="${s}"`:''}><is><t xml:space="preserve">${xesc(str)}</t></is></c>`};
  let rows=`<row r="1">${cols.map((c,i)=>cell(1,i,c[0],1)).join('')}</row>`;
  sorted.forEach((l,ri)=>{const r=ri+2;rows+=`<row r="${r}">${cols.map((c,i)=>cell(r,i,c[2](l),i===noteCol?2:0)).join('')}</row>`});

    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xesc(sheetName)}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${xesc(sheetName)}'!$A$1:$${colName(cols.length-1)}$${sorted.length+1}</definedName></definedNames></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFB0412F"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
    {name:'xl/worksheets/sheet1.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><dimension ref="A1:${last}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c[1]}" customWidth="1"/>`).join('')}</cols><sheetData>${rows}</sheetData><autoFilter ref="A1:${last}"/></worksheet>`}
  ];
  return zipStore(files);
}

/* ---------- deliver (share or download) ---------- */
async function deliver(blob,filename){
  try{
    const file=new File([blob],filename,{type:blob.type});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:filename});return}catch(e){if(e&&e.name==='AbortError')return}
    }
  }catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  toast(t('sent',{f:filename}));
}

const PHOTO_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
const str=(v,max)=>typeof v==='string'?v.slice(0,max||500):'';
function parsePack(text){
  text=String(text||'').trim();let obj=null;
  if(text.startsWith('{'))obj=JSON.parse(text);
  else{const m=text.match(/<script type="application\/json" id="vcl-data">([\s\S]*?)<\/script>/);if(m)obj=JSON.parse(m[1])}
  if(!obj||obj.app!=='vietcone-leads'||!Array.isArray(obj.leads))throw new Error('bad');
  if(obj.leads.some(l=>l&&l.pc>0&&!(Array.isArray(l.photos)&&l.photos.length))){
    const doc=new DOMParser().parseFromString(text,'text/html'),ph={};
    doc.querySelectorAll('article[data-id]').forEach(a=>{ph[a.getAttribute('data-id')]=[...a.querySelectorAll('img.pimg')].map(i=>i.getAttribute('src')||'')});
    obj.leads.forEach(l=>{if(l&&ph[l.id])l.photos=ph[l.id]});
  }
  return obj;
}
function mergeTags(inTags){
  const map={};let added=0;
  (Array.isArray(inTags)?inTags:[]).forEach(x=>{
    if(!x||typeof x.id!=='string')return;
    let local=tagById(x.id);
    if(!local){const lab=x.key?(T.vi['tag_'+x.key]?t('tag_'+x.key):x.key):str(x.label,40);local=findTagByLabel(lab);
      if(!local){local=x.key&&T.vi['tag_'+x.key]?{id:x.id,key:x.key}:{id:x.id,label:str(x.label,40)||x.id};if(!local.key&&!local.label)return;S.tags.push(local);added++}}
    map[x.id]=local.id;
  });
  saveSettings();return{map,added};
}
function cleanLead(r,map){
  if(!r||typeof r.id!=='string'||!str(r.name,120).trim())return null;
  const pick=(v,list)=>list.includes(v)?v:'';const arr=(v,list)=>Array.isArray(v)?v.filter(x=>list.includes(x)):[];
  const pax=parseInt(r.pax,10);
  return{id:r.id.slice(0,64),v:1,createdAt:str(r.createdAt,40)||nowISO(),updatedAt:str(r.updatedAt,40)||str(r.createdAt,40)||nowISO(),by:str(r.by,60),event:str(r.event,80),
    name:str(r.name,120).trim(),company:str(r.company,120),title:str(r.title,80),email:str(r.email,120),phone:str(r.phone,40),place:str(r.place,80),
    type:pick(r.type,TYPES),needs:arr(r.needs,NEEDS),dest:arr(r.dest,DESTS),month:/^\d{4}-\d{2}$/.test(r.month||'')?r.month:'',pax:isFinite(pax)&&pax>0?pax:null,
    next:pick(r.next,NEXTS),prio:pick(r.prio,PRIOS)||'C',tags:(Array.isArray(r.tags)?r.tags:[]).map(id=>map[id]).filter(Boolean),
    photos:(Array.isArray(r.photos)?r.photos:[]).filter(p=>typeof p==='string'&&PHOTO_RE.test(p)).slice(0,MAX_PHOTOS),note:str(r.note,4000)};
}
async function importPack(p){
  const {map,added}=mergeTags(p.tags);let a=0,u=0,s=0;
  for(const raw of p.leads){
    const l=cleanLead(raw,map);if(!l){s++;continue}
    const ex=S.leads.find(x=>x.id===l.id);
    if(!ex){S.leads.push(l);a++;try{await DB.put(l)}catch(e){}}
    else if((l.updatedAt||'')>(ex.updatedAt||'')){Object.assign(ex,l);u++;try{await DB.put(ex)}catch(e){}}
    else s++;
  }
  if(p.event&&typeof p.event==='string'&&p.event!==S.event){
    const ok=await confirmBox(t('event'),t('import_event_q',{e:str(p.event,80)}),t('btn_use'),false,t('btn_keep'));
    if(ok){S.event=str(p.event,80);saveSettings()}
  }
  askPersist();
  let msg=t('import_done',{a,u,s});if(added)msg+=' · '+t('import_tags',{n:added});
  return msg;
}

  addphoto(){if(S.draft.photos.length>=MAX_PHOTOS){toast(t('max_photo'));return}$('#photo-input').click()},
  rmphoto(el){S.draft.photos.splice(+el.dataset.i,1);$('#photos').innerHTML=photosBox()},
  viewimg(el){const src=el.dataset.lead?(S.leads.find(l=>l.id===el.dataset.lead)||{photos:[]}).photos[+el.dataset.i]:S.draft.photos[+el.dataset.i];if(!src)return;$('#viewer-img').src=src;$('#viewer').hidden=false},
  closeviewer(){$('#viewer').hidden=true;$('#viewer-img').removeAttribute('src')},
  canceledit(){S.editId=null;S.draft=newDraft();S.tab='list';render()},
  open(el){openDetail(el.dataset.id)},
  edit(el){const l=S.leads.find(x=>x.id===el.dataset.id);if(!l)return;S.editId=l.id;S.draft=draftFromLead(l);S.tab='new';S.addingTag=false;closeSheet();render();window.scrollTo(0,0)},
  async del(el){const l=S.leads.find(x=>x.id===el.dataset.id);if(!l)return;if(!await confirmBox(t('btn_delete'),t('confirm_delete',{name:l.name}),t('btn_delete'),true))return;S.leads=S.leads.filter(x=>x.id!==l.id);try{await DB.del(l.id)}catch(e){}closeSheet();render();toast(t('deleted'))},
  lf(el){S.lf=el.dataset.v;render()},
  ho(el){const s=S.ho[el.dataset.k],v=el.dataset.v;s.has(v)?s.delete(v):s.add(v);render()},
  hoclear(){Object.values(S.ho).forEach(s=>s.clear());render()},
  hoprev(){S.hoPrev=!S.hoPrev;render()},
  async sendpack(){const sel=selected();if(!sel.length){toast(t('nothing'));return}const html=packHTML('leads',sel,hoDesc());await deliver(new Blob([html],{type:'text/html'}),fileBase()+'.html')},
  async sendxlsx(){const sel=selected();if(!sel.length){toast(t('nothing'));return}await deliver(buildXLSX(sel),fileBase()+'.xlsx')},
  import(){$('#pack-input').click()},
  async setup(){const html=packHTML('setup',[],S.event||t('setup_title'));await deliver(new Blob([html],{type:'text/html'}),'vietcone-thiet-lap_'+(slug(S.event)||'su-kien')+'.html')},
  async backup(){if(!S.leads.length)return;const html=packHTML('backup',S.leads,t('pack_all'));await deliver(new Blob([html],{type:'text/html'}),'vietcone-sao-luu_'+stamp()+'.html')},
  async erase(){if(!await confirmBox(t('btn_erase'),t('confirm_erase',{n:S.leads.length}),t('btn_delete'),true))return;S.leads=[];try{await DB.clear()}catch(e){}closeSheet();render();toast(t('erased'))},
  async tagdel(el){const tg=tagById(el.dataset.id);if(!tg)return;const used=S.leads.filter(l=>(l.tags||[]).includes(tg.id));
    if(!await confirmBox(t('btn_delete'),t('confirm_tagdel',{t:tagLabel(tg),n:used.length}),t('btn_delete'),true))return;
    S.tags=S.tags.filter(x=>x.id!==tg.id);saveSettings();const ts=nowISO();
    for(const l of used){l.tags=l.tags.filter(x=>x!==tg.id);l.updatedAt=ts;try{await DB.put(l)}catch(e){}}
    if(S.draft)S.draft.tags=S.draft.tags.filter(x=>x!==tg.id);S.ho.tags.delete(tg.id);rerenderSheet()},
  settagadd(){const i=$('#s-newtag');if(addTag(i&&i.value))rerenderSheet()},
  start(){if(!S.name.trim()){$('#ob-err').textContent=t('err_you');$('#s-name').focus();return}S.ob=true;saveSettings();S.sheet=null;$('#sheet-wrap').hidden=true;document.body.classList.remove('noscroll');render()},
  async install(){if(!S.installEvt)return;S.installEvt.prompt();try{await S.installEvt.userChoice}catch(e){}S.installEvt=null;render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}});
$('#sheet-wrap').addEventListener('click',e=>{if(e.target.id==='sheet-wrap'){closeSheet();render()}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f&&S.draft){S.draft[el.dataset.f]=el.value;if(el.dataset.f==='name'){setErr('name','');el.classList.remove('bad')}if(['email','phone'].includes(el.dataset.f))setErr('reach','');if(['month','pax'].includes(el.dataset.f))refreshSuggest()}
  else if(el.id==='q'){S.lq=el.value;$('#cards').innerHTML=cardsHTML()}
  else if(el.dataset.s){S[el.dataset.s]=el.value.slice(0,80);saveSettings();$('#top').innerHTML=headerHTML();const er=$('#ob-err');if(er)er.textContent=''}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.tagid){const tg=tagById(el.dataset.tagid);const v=el.value.trim().slice(0,40);if(tg&&v&&v!==tagLabel(tg)){delete tg.key;tg.label=v;saveSettings()}else if(tg)el.value=tagLabel(tg)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='s-newtag'){e.preventDefault();ACT.settagadd()}
  else if(e.key==='Enter'&&e.target.id==='newtag'){e.preventDefault();ACT.tagadd()}
  else if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.closest('#lead-form')){e.preventDefault();const f=[...document.querySelectorAll('#lead-form input[data-f],#lead-form textarea')];const i=f.indexOf(e.target);if(i>=0&&f[i+1])f[i+1].focus();else e.target.blur()}if(e.key==='Escape'){if(!$('#viewer').hidden)ACT.closeviewer();else if(S.sheet&&S.sheet.type!=='onboard'){closeSheet();render()}}});
$('#photo-input').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';if(files.length)await addPhotos(files)});
$('#pack-input').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const p=parsePack(await f.text());S.lastImport=await importPack(p);toast(S.lastImport);render()}
  catch(err){toast(t('import_bad'))}
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;if(S.tab==='guide')render()});

/* ---------- boot ---------- */
(async function boot(){
  loadSettings();
  S.dbOk=await DB.open();
  if(S.dbOk){try{S.leads=(await DB.all())||[]}catch(e){S.leads=[]}}
  S.draft=newDraft();
  render();
  if(!S.ob||!S.name)openSheet(onboardHTML(),'onboard');
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
</body>
</html>
